services:
  - type: web
    name: deepfake-detector-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 300
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: LOAD_TF_MODEL
        value: "1"
      - key: LOAD_VIT_MODEL
        value: "1"
    healthCheckPath: /health
